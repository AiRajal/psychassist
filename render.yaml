services:
  - type: web
    name: psychassist
    runtime: node
    rootDir: server
    buildCommand: npm install && node db/setup.js
    startCommand: node index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
